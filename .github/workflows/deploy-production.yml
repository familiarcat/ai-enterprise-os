name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'

jobs:
  deploy:
    name: Build and Deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run AWS CodeBuild
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: SovereignFactoryBuild
          env-vars-for-codebuild: |
            IMAGE_TAG=${{ github.sha }},
            ENVIRONMENT=${{ github.event.inputs.environment }}

      - name: Update EC2 Deployment
        run: |
          # This assumes you have an EC2 setup with a runner or use CodeDeploy.
          # For a direct approach, we trigger a script on the host.
          echo "🚀 AWS CodeBuild complete. Notifying EC2 via SSM..."
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=["cd /app && docker-compose pull && docker-compose up -d"]'